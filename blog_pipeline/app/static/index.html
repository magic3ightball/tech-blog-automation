<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Pipeline</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="sidebar" aria-label="Codex sessions">
        <header class="sidebar-header">
          <div>
            <p class="eyebrow">Codex Sessions</p>
            <h1>Blog Pipeline</h1>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </header>

        <label class="search-label" for="searchInput">Search sessions</label>
        <input id="searchInput" type="search" placeholder="Search by topic or folder" />

        <div id="sessionCount" class="session-count"></div>
        <div id="sessionList" class="session-list"></div>
      </section>

      <section class="detail" aria-label="Session preview">
        <div id="emptyState" class="empty-state">
          <h2>Select a session</h2>
          <p>Choose a Codex conversation to preview before extracting blog candidates.</p>
        </div>

        <article id="sessionDetail" class="session-detail hidden">
          <header class="detail-header">
            <div>
              <p id="detailDate" class="eyebrow"></p>
              <h2 id="detailTitle"></h2>
              <p id="detailCwd" class="cwd"></p>
            </div>
            <button id="extractButton" type="button" disabled>Extract candidates</button>
          </header>
          <section id="candidatePanel" class="candidate-panel hidden" aria-label="Blog candidates">
            <div class="candidate-panel-header">
              <div>
                <p class="eyebrow">Candidates</p>
                <h3>Blog extract candidates</h3>
              </div>
              <button id="hideCandidatesButton" type="button">Hide</button>
            </div>
            <div id="candidateList" class="candidate-list"></div>
          </section>
          <div id="messageList" class="message-list"></div>
        </article>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
